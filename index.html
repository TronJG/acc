<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Todo Mobile</title>
  <meta name="theme-color" content="#2F8F5B" />
  <style>
    /* ================= BASE / THEME ================= */
    :root{
      --green:#2F8F5B;       /* xanh lá chủ đạo */
      --green-700:#206846;   /* xanh đậm cho hover */
      --red:#E11D48;         /* đỏ cho CHÚ Ý */
      --bg:#ffffff;          /* trắng */
      --ink:#0f172a;         /* text */
      --muted:#94a3b8;       /* phụ */
      --ring:rgba(47,143,91,.25);
      --radius:14px;
      --shadow:0 6px 18px rgba(16,185,129,.15);
    }
    html,body{height:100%}
    html{ -webkit-text-size-adjust: 100%; }
    body{
      margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background:var(--bg); color:var(--ink);
    }
    *{ box-sizing: border-box }

    /* ============= LAYOUT (mobile-first) ============= */
    .app{ max-width:720px; margin:0 auto; padding:12px 12px 24px; }
    .topbar{
      position: sticky; top:0; z-index:10; background:var(--bg);
      padding:10px 4px 12px; border-bottom:1px solid #eef2f7;
      display:flex; align-items:center; gap:12px;
    }
    .brand{ font-weight:800; font-size:18px; letter-spacing:.2px; }
    .badge{ font-size:12px; color:var(--bg); background:var(--green); padding:4px 8px; border-radius:999px }

    /* input row */
    .new-row{ display:flex; gap:8px; margin:12px 0 8px }
    .input{ flex:1; display:flex; background:#f8fafc; border:1px solid #e2e8f0; border-radius:var(--radius); padding:2px }
    .input input{
      flex:1; border:0; background:transparent; padding:14px 12px; font-size:16px; outline:none; /* >=16px để iOS KHÔNG phóng to */
    }
    .input:focus-within{ border-color:var(--green); box-shadow:0 0 0 4px var(--ring) }

    .btn{ -webkit-tap-highlight-color: transparent; appearance:none; border:0; cursor:pointer; border-radius:12px; padding:12px 14px; font-weight:700; font-size:15px; }
    .btn-green{ background:var(--green); color:#fff; box-shadow:var(--shadow) }
    .btn-green:active{ transform: translateY(1px) }
    .btn-ghost{ background:#eef5f0; color:var(--green); font-weight:700 }

    .tools{ display:flex; gap:8px; align-items:center; }

    /* ====== list ====== */
    .list{ display:grid; gap:10px; margin-top:12px }
    .item{
      display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:flex-start;
      background:#fff; border:1px solid #e5e7eb; border-radius:16px; padding:12px; box-shadow:0 2px 10px rgba(0,0,0,.04);
    }
    .check{ width:24px; height:24px; border:2px solid var(--green); border-radius:8px; display:inline-grid; place-items:center; flex:none; }
    .check.done{ background:var(--green); color:#fff }

    .title{ font-size:16px; line-height:1.3; font-weight:700; word-break:break-word }
    .meta{ font-size:12px; color:var(--muted); margin-top:2px; display:flex; gap:10px; flex-wrap:wrap }
    .actions{ display:flex; gap:6px; align-items:center }
    .chip{ font-size:11px; padding:6px 8px; border-radius:999px; background:#f1f5f9; }
    .chip.red{ background:#fff1f2; color:var(--red); border:1px solid #fecdd3 }

    .note{ margin-top:8px; background:#f8fafc; border:1px dashed #cbd5e1; padding:8px 10px; border-radius:12px; font-size:14px }

    .thumb{ margin-top:8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap }
    .thumb img{ width:88px; height:88px; object-fit:cover; border-radius:12px; border:1px solid #e5e7eb }

    .muted{ color:var(--muted) }

    /* bottom action bar for mobile */
    .fabbar{ position: sticky; bottom:0; padding:10px 0 2px; background:linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,1) 26%); }
    .fabrow{ display:flex; gap:8px }

    /* helpers */
    .hidden{ display:none !important }
    .sr{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0 }

    /* small screens */
    @media (min-width:560px){ .brand{ font-size:20px } }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">✅ Todo</div>
      <span class="badge" id="count">0 việc</span>
      <div class="tools" style="margin-left:auto">
        <button class="btn btn-ghost" id="clearDone">Xóa đã xong</button>
      </div>
    </header>

    <!-- New task row -->
    <div class="new-row" aria-label="Thêm công việc">
      <div class="input" role="group" aria-label="Nội dung công việc">
        <input id="newTitle" inputmode="text" autocomplete="off" placeholder="Việc cần làm... (ví dụ: gọi cho khách)" />
      </div>
      <button class="btn btn-green" id="addBtn">Thêm</button>
    </div>

    <!-- Tips (red for attention) -->
    <div class="note" style="border-color:#fecdd3;background:#fff1f2;color:var(--red)">
      ⚠️ Mẹo: giữ nội dung ngắn gọn. Gắn <strong>CHÚ Ý</strong> cho việc quan trọng – phần này sẽ hiển thị màu đỏ.
    </div>

    <!-- List -->
    <section class="list" id="list" aria-live="polite"></section>

    <div class="fabbar">
      <div class="fabrow">
        <button class="btn btn-green" style="flex:1" id="exportJSON">Xuất dữ liệu</button>
        <label class="btn btn-ghost" style="flex:1" for="importFile">Nhập dữ liệu</label>
        <input class="hidden" type="file" id="importFile" accept="application/json" />
      </div>
    </div>
  </div>

  <template id="itemTpl">
    <article class="item" data-id="">
      <button class="check" aria-label="Đánh dấu hoàn thành"><span class="sr">x</span></button>
      <div>
        <div class="title"></div>
        <div class="meta">
          <span class="chip createdAt"></span>
          <span class="chip attention hidden">CHÚ Ý</span>
        </div>
        <div class="note hidden"></div>
        <div class="thumb hidden"></div>
      </div>
      <div class="actions">
        <button class="btn btn-ghost btn-note" title="Thêm ghi chú">Ghi chú</button>
        <button class="btn btn-ghost btn-flag" title="Đánh dấu chú ý" style="color:var(--red)">Chú ý!</button>
        <label class="btn btn-ghost btn-upload" title="Tải ảnh hoàn thành">
          Ảnh
          <input type="file" class="hidden file" accept="image/*" />
        </label>
        <button class="btn btn-ghost btn-del" title="Xóa">Xóa</button>
      </div>
    </article>
  </template>

  <script>
  ;(()=>{
    const $ = s=>document.querySelector(s);
    const $$ = s=>document.querySelectorAll(s);

    const key = 'todo.mobile.v1';
    /** @type {Array<{id:string,title:string,done:boolean,note?:string,images?:string[],attention?:boolean,createdAt:number}>} */
    let todos = load();

    const newTitle = $('#newTitle');
    const addBtn = $('#addBtn');
    const list = $('#list');
    const count = $('#count');
    const clearDone = $('#clearDone');
    const tpl = /** @type {HTMLTemplateElement} */ ($('#itemTpl'));

    // ======= Utilities =======
    function id(){ return Math.random().toString(36).slice(2,10) }
    function fmt(ts){
      const d = new Date(ts);
      const dd = d.toLocaleDateString('vi-VN',{ day:'2-digit', month:'2-digit'});
      const tt = d.toLocaleTimeString('vi-VN',{ hour:'2-digit', minute:'2-digit'});
      return `Tạo ${dd} ${tt}`;
    }
    function save(){ localStorage.setItem(key, JSON.stringify(todos)) }
    function load(){ try{ return JSON.parse(localStorage.getItem(key)||'[]') }catch{ return [] } }

    function render(){
      list.innerHTML = '';
      todos.forEach(t=>{
        const node = tpl.content.firstElementChild.cloneNode(true);
        node.dataset.id = t.id;
        const check = node.querySelector('.check');
        const title = node.querySelector('.title');
        const created = node.querySelector('.createdAt');
        const note = node.querySelector('.note');
        const thumbs = node.querySelector('.thumb');
        const chipAttention = node.querySelector('.attention');

        title.textContent = t.title;
        created.textContent = fmt(t.createdAt||Date.now());
        if(t.done){ check.classList.add('done'); title.style.textDecoration='line-through'; title.classList.add('muted') }
        if(t.note){ note.textContent = t.note; note.classList.remove('hidden') }
        if(t.images && t.images.length){
          thumbs.innerHTML = '';
          t.images.forEach(src=>{
            const img = new Image(); img.src = src; img.alt = 'Ảnh hoàn thành';
            thumbs.appendChild(img);
          });
          thumbs.classList.remove('hidden');
        }
        if(t.attention){ chipAttention.classList.remove('hidden'); chipAttention.classList.add('red') }

        // wire actions
        node.querySelector('.btn-note').addEventListener('click',()=>{
          const text = prompt('Ghi chú cho công việc này:', t.note||'');
          if(text!==null){ t.note = text.trim(); if(!t.note) delete t.note; save(); render(); }
        });
        node.querySelector('.btn-flag').addEventListener('click',()=>{
          t.attention = !t.attention; save(); render();
        });
        node.querySelector('.btn-del').addEventListener('click',()=>{
          if(confirm('Xóa công việc này?')){ todos = todos.filter(x=>x.id!==t.id); save(); render(); }
        });
        node.querySelector('.file').addEventListener('change', (e)=>{
          const file = e.target.files?.[0]; if(!file) return;
          const fr = new FileReader();
          fr.onload = ()=>{
            const src = fr.result;
            t.images = t.images||[]; t.images.push(src);
            save(); render();
          };
          fr.readAsDataURL(file);
        });
        check.addEventListener('click',()=>{
          t.done = !t.done; save(); render();
        });
        list.appendChild(node);
      });
      count.textContent = `${todos.filter(t=>!t.done).length} việc`;
    }

    // ======= add =======
    function add(){
      const title = newTitle.value.trim();
      if(!title){ newTitle.focus(); return; }
      todos.unshift({ id:id(), title, done:false, createdAt:Date.now(), images:[] });
      newTitle.value=''; save(); render();
    }

    addBtn.addEventListener('click', add);
    newTitle.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); } });

    clearDone.addEventListener('click', ()=>{
      const has = todos.some(t=>t.done);
      if(!has) return alert('Chưa có việc nào hoàn thành.');
      if(confirm('Xóa tất cả việc đã hoàn thành?')){
        todos = todos.filter(t=>!t.done); save(); render();
      }
    });

    // ======= initial render =======
    render();

    // ======= Prevent iOS zoom side-effect on double-tap buttons =======
    let last = 0; document.addEventListener('click', (e)=>{ const now = Date.now(); if(now-last<350){ e.preventDefault(); } last = now; }, true);
  })();
  </script>
</body>
</html>
