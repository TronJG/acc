<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ToDo — Dương Liễu Mộc (Tối giản)</title>
  <meta name="theme-color" content="#2F8F5B" />
  <style>
    /* =====================
       TỐI GIẢN, TẬP TRUNG MOBILE
       Palette: Dương Liễu Mộc
       ===================== */
    :root{
      --primary:#2F8F5B;     /* rừng ngọc */
      --primary-700:#206846;
      --accent:#2E7DAF;      /* nước xanh */
      --bg:#0f1210;          /* nền tối xanh rêu */
      --card:#141a16;
      --ink:#E7F1EA;         /* chữ sáng dịu */
      --muted:#9fb5a7;       /* chữ phụ */
      --line:#213226;        /* viền */
      --radius:16px;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#F3F7F4; --card:#FFFFFF; --ink:#102219; --muted:#4B6B59; --line:#DCE7E0; --shadow:0 8px 20px rgba(32,104,70,.10);
      }
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{ margin:0; font: 16px/1.35 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; color:var(--ink); background:var(--bg); -webkit-tap-highlight-color: transparent }

    .app{ max-width:720px; margin:0 auto; min-height:100%; display:flex; flex-direction:column }

    /* Header — một hàng, tối giản */
    .topbar{ position:sticky; top:0; z-index:5; padding: calc(env(safe-area-inset-top) + 10px) 16px 12px; background:linear-gradient(180deg, rgba(20,26,22,.85), rgba(20,26,22,.6)); backdrop-filter: blur(10px); border-bottom:1px solid var(--line) }
    @media (prefers-color-scheme: light){ .topbar{ background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.82)); } }
    .brand{ display:flex; align-items:center; gap:10px }
    .logo{ width:26px; height:26px; border-radius:8px; background: linear-gradient(135deg, var(--primary), var(--accent)); box-shadow: inset 0 0 0 2px rgba(255,255,255,.12) }
    h1{ font-size:17px; margin:0; letter-spacing:.2px }

    /* Quick add — một trường + 1 nút lớn */
    .quick{ margin-top:10px; display:grid; grid-template-columns:1fr auto; gap:10px }
    .input{ width:100%; border:none; outline:none; background:var(--card); color:var(--ink); padding:14px 14px; border-radius:14px; box-shadow: var(--shadow); border:1px solid var(--line) }
    .input::placeholder{ color:var(--muted) }
    .btn{ height:48px; padding:0 16px; border:none; border-radius:14px; background:var(--primary); color:#eafff3; font-weight:800; letter-spacing:.3px; box-shadow: var(--shadow) }
    .btn:active{ transform: translateY(1px) }

    /* Tabs — chỉ 3 filter cốt lõi */
    .tabs{ display:grid; grid-template-columns: repeat(3,1fr); gap:8px; padding:12px 16px; }
    .tab{ height:40px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--muted) }
    .tab.active{ background: linear-gradient(135deg, var(--primary), var(--accent)); color:#06201a; font-weight:800; border-color: transparent }

    /* List tối giản, tap targets ≥48px */
    .list{ padding: 0 16px 120px; display:grid; gap:10px }
    .item{ display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 12px }

    .tick{ width:28px; height:28px; border-radius:10px; display:grid; place-items:center; background:transparent; border:2px solid var(--primary); color:var(--primary); font-weight:900 }
    .tick.done{ background:var(--primary); color:#082415 }

    .title{ font-weight:700; font-size:15px; line-height:1.35; color:var(--ink) }
    .meta{ display:flex; gap:8px; margin-top:4px; flex-wrap:wrap }
    .pill{ font-size:12px; padding:6px 8px; border-radius:999px; background:rgba(47,143,91,.12); color:var(--primary); border:1px solid var(--line) }
    .low{ background:rgba(46,125,175,.10); color:var(--accent) }

    .more{ width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--muted) }

    /* Bottom bar — 2 nút cần thiết */
    .bottom{ position:fixed; left:0; right:0; bottom:0; z-index:10; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: rgba(10,14,12,.85); backdrop-filter: blur(10px); border-top:1px solid var(--line) }
    @media (prefers-color-scheme: light){ .bottom{ background: rgba(255,255,255,.9) } }
    .row{ display:grid; grid-template-columns: 1fr 1fr; gap:10px }
    .bb{ height:48px; border-radius:14px; border:1px solid var(--line); background:var(--card); color:var(--muted) }
    .bb.primary{ background:var(--primary); color:#eafff3; font-weight:800; border-color:transparent }

    /* Sheet tối giản */
    .modal{ position:fixed; inset:0; z-index:20; display:none; align-items:flex-end; justify-content:center; padding: 24px 16px; background: rgba(0,0,0,.35) }
    .sheet{ width:100%; max-width:720px; border-radius:18px; background:var(--card); border:1px solid var(--line); box-shadow: var(--shadow); padding:14px }
    .grid{ display:grid; gap:10px }
    .row2{ display:grid; gap:10px; grid-template-columns: 1fr 1fr }
    .label{ font-size:12px; color:var(--muted) }
    .field{ width:100%; border:1px solid var(--line); background: transparent; color:var(--ink); border-radius:12px; padding:12px }
    .textarea{ min-height:84px; resize: vertical }

    .empty{ text-align:center; color:var(--muted); padding:26px 6px }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><div class="logo"></div><h1>ToDo — Dương Liễu Mộc</h1></div>
      <div class="quick">
        <input id="q" class="input" placeholder="Thêm nhanh (ví dụ: Gọi KH A 10:30 mai #p1)" />
        <button id="add" class="btn">+ Thêm</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-filter="all">Tất cả</button>
      <button class="tab" data-filter="today">Hôm nay</button>
      <button class="tab" data-filter="done">Đã xong</button>
    </nav>

    <main id="list" class="list"></main>

    <footer class="bottom">
      <div class="row">
        <button id="backup" class="bb">Sao lưu</button>
        <button id="focusToday" class="bb primary">Tập trung hôm nay</button>
      </div>
    </footer>
  </div>

  <!-- Sheet -->
  <div id="sheetWrap" class="modal">
    <div class="sheet">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px; margin-bottom:6px">
        <strong>Chi tiết</strong>
        <button id="closeSheet" class="bb" style="width:44px;height:36px">✕</button>
      </div>
      <div class="grid">
        <div>
          <div class="label">Tiêu đề</div>
          <input id="fTitle" class="field" placeholder="Nhập tiêu đề..." />
        </div>
        <div class="row2">
          <div>
            <div class="label">Hạn</div>
            <input id="fDue" class="field" type="date" />
          </div>
          <div>
            <div class="label">Giờ</div>
            <input id="fTime" class="field" type="time" />
          </div>
        </div>
        <div class="row2">
          <div>
            <div class="label">Ưu tiên</div>
            <select id="fPrio" class="field">
              <option value="2">Trung bình</option>
              <option value="1">Cao</option>
              <option value="3">Thấp</option>
            </select>
          </div>
          <div>
            <div class="label">Thẻ</div>
            <input id="fTags" class="field" placeholder="#khách #sếp" />
          </div>
        </div>
        <div>
          <div class="label">Ghi chú</div>
          <textarea id="fNotes" class="field textarea" placeholder="Ghi chú thêm..."></textarea>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr 56px; gap:10px; margin-top:6px">
          <button id="save" class="btn">Lưu</button>
          <button id="snooze1d" class="bb">Hoãn +1d</button>
          <button id="del" class="bb" title="Xoá">🗑️</button>
        </div>
      </div>
    </div>
  </div>

  <input id="picker" type="file" accept="application/json" style="display:none" />

  <script>
    // =============== CORE ===============
    const $ = (s, el=document) => el.querySelector(s);
    const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));

    const KEY='todo_moc_v1';
    let tasks = load();
    let filter='all';
    let editingId=null;

    function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36) }
    function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||[] }catch{ return [] } }
    function save(){ localStorage.setItem(KEY, JSON.stringify(tasks)) }
    function todayStr(){ return new Date().toISOString().slice(0,10) }

    function add(title, opt={}){
      const t={ id:uid(), title:(title||'').trim(), done:false, prio:opt.prio||2, due:opt.due||'', time:opt.time||'', tags:opt.tags||[], notes:opt.notes||'', createdAt:Date.now() };
      if(!t.title) return; tasks.unshift(t); save(); render();
    }
    function patch(id, p){ const i=tasks.findIndex(x=>x.id===id); if(i<0) return; tasks[i]={...tasks[i], ...p}; save(); render(); }
    function drop(id){ tasks = tasks.filter(x=>x.id!==id); save(); render(); }

    function parseQuick(s){
      // cực gọn: giờ hh:mm | các từ khóa: hôm nay/mai | dd/mm
      const due = parseDateLoose(s); const time=parseTimeLoose(s); const prio = /(p1|urgent|gấp|!{2,})/i.test(s)?1: /(p3|thấp)/i.test(s)?3:2;
      const tags = (s.match(/(^|\s)(#\w+)/g)||[]).map(x=>x.trim());
      let title = s.replace(/(^|\s)#\w+/g,' ').replace(/\b(hôm nay|mai|mốt)\b/gi,' ').replace(/\b(p[13]|urgent|gấp)\b/gi,' ').replace(/\b\d{1,2}[:h]\d{2}\b/gi,' ').replace(/\b\d{1,2}[\/\.-]\d{1,2}(?:[\/\.-]\d{2,4})?\b/g,' ').replace(/\s+/g,' ').trim();
      if(!title) title=s.trim();
      return {title,due,time,prio,tags};
    }
    function parseDateLoose(s){ s=s.toLowerCase(); if(/hôm nay/.test(s)) return todayStr(); if(/mai/.test(s)) { const d=new Date(); d.setDate(d.getDate()+1); return d.toISOString().slice(0,10);} if(/mốt/.test(s)){ const d=new Date(); d.setDate(d.getDate()+2); return d.toISOString().slice(0,10);} const m=s.match(/\b(\d{1,2})[\/-\.](\d{1,2})(?:[\/-\.](\d{2,4}))?\b/); if(m){ let[_,dd,MM,yy]=m; const Y=yy? (yy.length===2?2000+Number(yy):Number(yy)): new Date().getFullYear(); const d=new Date(Y,Number(MM)-1,Number(dd)); if(!isNaN(d)) return d.toISOString().slice(0,10);} return '' }
    function parseTimeLoose(s){ const m=(s.toLowerCase().match(/\b(\d{1,2})[:h](\d{2})\b/)); if(m){ let[_,h,mn]=m; h=String(h).padStart(2,'0'); return `${h}:${mn}` } return '' }

    function byFilter(t){ if(filter==='all') return true; if(filter==='today') return t.due===todayStr() && !t.done; if(filter==='done') return t.done; }

    function fmtDue(d){ if(!d) return ''; const today=todayStr(); if(d===today) return 'Hôm nay'; const ts=new Date(d), now=new Date(today); const df=Math.round((ts-now)/86400000); if(df===1) return 'Ngày mai'; if(df===-1) return 'Hôm qua'; return d.split('-').reverse().join('/') }

    function render(){
      const list=$('#list'); list.innerHTML='';
      const data=tasks.filter(byFilter);
      if(!data.length){ list.innerHTML='<div class="empty">Trống. Thêm việc ở trên nhé.</div>'; return; }
      for(const t of data){
        const row=document.createElement('div'); row.className='item'; row.innerHTML=`
          <button class="tick ${t.done?'done':''}" aria-label="toggle">${t.done?'✓':''}</button>
          <div>
            <div class="title" style="${t.done?'text-decoration:line-through; opacity:.6':''}">${escape(t.title)}</div>
            <div class="meta">
              ${t.due? `<span class="pill">${fmtDue(t.due)}${t.time? ' • '+t.time:''}</span>`:''}
              <span class="pill ${t.prio===3?'low':''}">P${t.prio}</span>
              ${(t.tags||[]).slice(0,2).map(x=>`<span class="pill low">${escape(x)}</span>`).join('')}
            </div>
          </div>
          <button class="more" aria-label="more">⋯</button>`;
        row.querySelector('.tick').onclick=()=>patch(t.id,{done:!t.done});
        row.querySelector('.more').onclick=()=>openSheet(t.id);
        list.appendChild(row);
      }
      // sync tab UI
      $$('.tab').forEach(b=> b.classList.toggle('active', b.dataset.filter===filter));
    }

    function escape(s){ return (s||'').replace(/[&<>]/g, c=> ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) }

    // Sheet
    function openSheet(id){ editingId=id; const t=tasks.find(x=>x.id===id)||{}; $('#fTitle').value=t.title||''; $('#fDue').value=t.due||''; $('#fTime').value=t.time||''; $('#fPrio').value=t.prio||2; $('#fTags').value=(t.tags||[]).join(' '); $('#fNotes').value=t.notes||''; $('#sheetWrap').style.display='flex'; }
    function closeSheet(){ $('#sheetWrap').style.display='none'; editingId=null }

    // Events
    $('#add').onclick=()=>{ const q=$('#q').value.trim(); if(!q) return $('#q').focus(); const p=parseQuick(q); add(p.title,p); $('#q').value=''; };
    $('#q').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#add').click(); });
    $('#closeSheet').onclick=closeSheet;
    $('#save').onclick=()=>{ const data={ title:$('#fTitle').value.trim(), due:$('#fDue').value, time:$('#fTime').value, prio:+$('#fPrio').value, tags:$('#fTags').value.split(/\s+/).filter(Boolean), notes:$('#fNotes').value.trim() }; if(!data.title) return alert('Nhập tiêu đề'); if(editingId) patch(editingId,data); else add(data.title,data); closeSheet(); };
    $('#del').onclick=()=>{ if(!editingId) return; if(confirm('Xoá công việc này?')){ drop(editingId); closeSheet(); } };
    $('#snooze1d').onclick=()=>{ if(!editingId) return; const t=tasks.find(x=>x.id===editingId); const d=t?.due||todayStr(); const dt=new Date(d); dt.setDate(dt.getDate()+1); patch(editingId,{due:dt.toISOString().slice(0,10)}); };

    $$('.tab').forEach(b=> b.onclick=()=>{ filter=b.dataset.filter; render(); });

    // backup
    $('#backup').onclick=()=>{ const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),tasks},null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='todo-moc-backup.json'; a.click(); URL.revokeObjectURL(a.href); };

    // focus today = set filter + scroll top
    $('#focusToday').onclick=()=>{ filter='today'; window.scrollTo({top:0,behavior:'smooth'}); render(); };

    // Init
    render();
  </script>
</body>
</html>
