<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ToDo Mobile — Focus từ chat</title>
  <meta name="theme-color" content="#111827" />
  <style>
    /* =====================
       MOBILE-FIRST STYLES
       ===================== */
    :root{
      --bg: #0b1220;           /* base (dark) */
      --card: #121a2a;
      --ink: #e5e7eb;          /* text */
      --ink-dim:#b6c2d2;
      --muted:#94a3b8;
      --brand:#22d3ee;         /* cyan */
      --brand-2:#38bdf8;       /* sky */
      --ok:#10b981;            /* green */
      --warn:#f59e0b;          /* amber */
      --danger:#ef4444;        /* red */
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 16px;
      --radius-sm: 12px;
    }
    @media (prefers-color-scheme: light){
      :root{ --bg:#f4f7fb; --card:#fff; --ink:#0f172a; --ink-dim:#42526b; --muted:#64748b; --shadow:0 8px 24px rgba(2,6,23,.08); }
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{ margin:0; background:var(--bg); color:var(--ink); font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; -webkit-tap-highlight-color:transparent }

    .app{ max-width:720px; margin:0 auto; min-height:100%; display:flex; flex-direction:column }

    /* Topbar */
    .topbar{ position:sticky; top:0; z-index:5; padding: env(safe-area-inset-top) 16px 12px; backdrop-filter: blur(12px);
      background: linear-gradient(180deg, rgba(11,18,32,.85), rgba(11,18,32,.6)); border-bottom:1px solid rgba(255,255,255,.06) }
    @media(prefers-color-scheme: light){ .topbar{ background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.7)); border-bottom:1px solid rgba(2,6,23,.06) } }
    .top-title{ display:flex; align-items:center; gap:10px }
    .logo{ width:28px; height:28px; border-radius:8px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); box-shadow: inset 0 0 0 2px rgba(255,255,255,.14) }
    h1{ font-size:18px; margin:0; letter-spacing:.2px }

    .quick-add{ margin-top:10px; display:grid; grid-template-columns:1fr auto auto; gap:10px }
    .input{ width:100%; border:none; outline:none; background:var(--card); color:var(--ink); padding:14px 14px; border-radius:14px; box-shadow: var(--shadow); transition:.2s box-shadow,.2s transform }
    .input::placeholder{ color:var(--muted) }
    .btn{ appearance:none; border:none; cursor:pointer; border-radius:14px; padding:0 16px; display:inline-flex; align-items:center; justify-content:center; gap:8px; height:48px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2)); color:#06202a; font-weight:700; letter-spacing:.2px; box-shadow: var(--shadow) }
    .btn:active{ transform: translateY(1px) }
    .btn-ghost{ height:48px; padding:0 14px; border-radius:14px; background: rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); color:var(--ink-dim) }

    /* Search + Filter */
    .toolbar{ padding:12px 16px; display:grid; grid-template-columns: 1fr 42px; gap:10px }
    .chipbar{ display:flex; gap:8px; overflow:auto; padding: 0 16px 10px; scrollbar-width:none }
    .chipbar::-webkit-scrollbar{ display:none }
    .chip{ flex:0 0 auto; height:36px; padding:0 12px; border-radius:999px; display:inline-flex; align-items:center; gap:8px; font-weight:600; color:var(--ink-dim); background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.06) }
    .chip.active{ color:#06202a; background: linear-gradient(135deg, var(--brand), var(--brand-2)); border-color: transparent }

    /* Sections */
    .section{ padding: 0 16px 8px; color:var(--ink-dim); font-size:12px; text-transform:uppercase; letter-spacing:.4px }

    /* List */
    .list{ padding: 0 16px 120px; display:grid; gap:12px }
    .card{ position:relative; border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); overflow:hidden }

    /* Swipe rails */
    .rail{ position:absolute; inset:0; display:flex; align-items:center; justify-content:space-between; padding:0 16px; pointer-events:none; font-weight:700 }
    .rail .left{ color:var(--ok); opacity:.9 }
    .rail .right{ color:var(--danger); opacity:.9 }

    .item{ position:relative; display:grid; grid-template-columns:auto 1fr auto; gap:12px; padding:14px 14px; align-items:flex-start; touch-action: pan-y }

    .check{ width:22px; height:22px; border-radius:8px; background: rgba(255,255,255,.06); border:1.5px solid rgba(255,255,255,.18); display:grid; place-items:center; margin-top:2px }
    .check svg{ opacity:0; transform:scale(.5); transition:.15s }
    .check.done{ background: rgba(16,185,129,.15); border-color: rgba(16,185,129,.8) }
    .check.done svg{ opacity:1; transform:none }

    .meta{ min-width:0 }
    .title{ font-weight:700; font-size:15px; line-height:1.35; word-wrap:break-word }
    .title.done{ text-decoration: line-through; color: var(--muted) }
    .sub{ margin-top:6px; display:flex; flex-wrap:wrap; gap:8px }
    .badge{ font-size:12px; color:var(--ink-dim); background: rgba(255,255,255,.06); padding:6px 8px; border-radius:8px; border:1px solid rgba(255,255,255,.06)}
    .prio-1{ color: #ef4444 }
    .prio-2{ color: #f59e0b }
    .prio-3{ color: #10b981 }

    .actions{ display:flex; gap:6px }
    .iconbtn{ width:40px; height:40px; border-radius:12px; border:1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.04); display:grid; place-items:center }
    .iconbtn:active{ transform: translateY(1px) }

    /* Bottom nav */
    .bottom{ position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: rgba(11,18,32,.8); backdrop-filter: blur(12px); border-top:1px solid rgba(255,255,255,.06)} 
    @media(prefers-color-scheme: light){ .bottom{ background: rgba(255,255,255,.85); border-top:1px solid rgba(2,6,23,.06)} }
    .bottom .row{ display:grid; grid-template-columns: repeat(5, 1fr); gap:10px }
    .bbtn{ height:48px; border-radius:14px; display:grid; place-items:center; font-size:12px; color:var(--ink-dim); border:1px solid rgba(255,255,255,.06); background: rgba(255,255,255,.04) }
    .bbtn.active{ color:#06202a; background: linear-gradient(135deg, var(--brand), var(--brand-2)); border-color: transparent; font-weight:800 }

    /* Modal */
    .modal{ position: fixed; inset:0; z-index:20; display:none; align-items:flex-end; justify-content:center; padding: 24px 16px; background: rgba(0,0,0,.35) }
    .sheet{ width:100%; max-width:720px; border-radius: 20px; background: var(--card); box-shadow: var(--shadow); padding:16px }
    .grid{ display:grid; gap:10px }
    .row2{ display:grid; grid-template-columns: 1fr 1fr; gap:10px }
    .label{ font-size:12px; color:var(--muted) }
    .sel, .textarea{ width:100%; border:none; outline:none; background: rgba(255,255,255,.06); color:var(--ink); padding:12px 12px; border-radius:12px }
    .textarea{ min-height: 84px; resize: vertical }

    .empty{ text-align:center; opacity:.7; padding:28px 8px }

    /* Capture modal */
    .caps{ display:grid; gap:10px }
    .caps .src{ min-height:140px }
    .caps .cand{ max-height:46vh; overflow:auto; display:grid; gap:8px }
    .cand .row{ display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:start; padding:8px; border-radius:12px; background: rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.06) }
    .cand .row input{ margin-top:6px }

    /* Focus view (today route) */
    .timeline{ padding:0 16px 8px }
    .trow{ display:grid; grid-template-columns: 76px 1fr; gap:10px; align-items:start; margin:10px 0 }
    .ttime{ font-size:12px; color:var(--ink-dim) }
    .tpill{ background:var(--card); border:1px solid rgba(255,255,255,.06); border-radius:14px; padding:10px 12px }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="top-title">
        <div class="logo" aria-hidden="true"></div>
        <h1>ToDo Mobile</h1>
      </div>
      <div class="quick-add">
        <input id="newTitle" class="input" placeholder="Thêm nhanh (ví dụ: Gọi khách A 10:30 mai)" />
        <button id="addBtn" class="btn" title="Thêm">+ Thêm</button>
        <button id="captureBtn" class="btn-ghost" title="Bóc việc từ chat">Bóc</button>
      </div>
    </header>

    <div class="toolbar">
      <input id="search" class="input" placeholder="Tìm kiếm..." />
      <button id="moreBtn" class="iconbtn" title="Thêm chi tiết">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </button>
    </div>

    <div class="chipbar" id="chipbar">
      <button class="chip active" data-filter="all">Tất cả</button>
      <button class="chip" data-filter="today">Hôm nay</button>
      <button class="chip" data-filter="pending">Chưa xong</button>
      <button class="chip" data-filter="done">Đã xong</button>
      <button class="chip" data-filter="priority">Ưu tiên</button>
    </div>

    <div class="section">Lộ trình hôm nay</div>
    <div class="timeline" id="timeline"></div>

    <div class="section">Danh sách</div>
    <main class="list" id="list"></main>

    <footer class="bottom">
      <div class="row">
        <button class="bbtn active" data-filter="all">Tất cả</button>
        <button class="bbtn" data-filter="today">Hôm nay</button>
        <button class="bbtn" data-filter="pending">Chưa xong</button>
        <button class="bbtn" data-filter="priority">Ưu tiên</button>
        <button class="bbtn" id="exportBtn">Sao lưu</button>
      </div>
    </footer>
  </div>

  <!-- Detail / Add-more Modal -->
  <div class="modal" id="modal">
    <div class="sheet">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px">
        <strong>Chi tiết công việc</strong>
        <button class="iconbtn" id="closeModal" title="Đóng">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="grid">
        <div>
          <div class="label">Tiêu đề</div>
          <input id="fTitle" class="sel" placeholder="Nhập tiêu đề..." />
        </div>
        <div class="row2">
          <div>
            <div class="label">Hạn</div>
            <input id="fDue" class="sel" type="date" />
          </div>
          <div>
            <div class="label">Giờ (tuỳ chọn)</div>
            <input id="fTime" class="sel" type="time" />
          </div>
        </div>
        <div class="row2">
          <div>
            <div class="label">Mức ưu tiên</div>
            <select id="fPrio" class="sel">
              <option value="2">Trung bình</option>
              <option value="1">Cao</option>
              <option value="3">Thấp</option>
            </select>
          </div>
          <div>
            <div class="label">Hashtag</div>
            <input id="fTags" class="sel" placeholder="#khách #sếp #urgent" />
          </div>
        </div>
        <div>
          <div class="label">Ghi chú / Nguồn</div>
          <textarea id="fNotes" class="textarea" placeholder="Dán đoạn chat hoặc link tham chiếu..."></textarea>
        </div>
        <div style="display:flex; gap:10px; margin-top:6px; flex-wrap:wrap">
          <button id="saveDetail" class="btn" style="flex:1">Lưu</button>
          <button id="snooze30" class="btn-ghost" title="Hoãn 30 phút">Hoãn 30’</button>
          <button id="snooze1d" class="btn-ghost" title="Hoãn 1 ngày">Hoãn +1d</button>
          <button id="deleteTask" class="iconbtn" title="Xoá" style="width:56px">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Capture from chat Modal -->
  <div class="modal" id="capModal">
    <div class="sheet">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px">
        <strong>Bóc việc từ đoạn chat</strong>
        <button class="iconbtn" id="closeCap" title="Đóng">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="caps">
        <textarea id="capSrc" class="textarea src" placeholder="Dán đoạn chat ở đây. Ví dụ: \n— Mai 9h review báo cáo doanh thu\n— Gửi lại hợp đồng KH A trước 15/11\n— Fix bug thanh toán (urgent)"></textarea>
        <div style="display:flex; gap:10px; align-items:center">
          <button id="capParse" class="btn" style="flex:1">Phân tích</button>
          <button id="capSelectAll" class="btn-ghost">Chọn tất</button>
        </div>
        <div id="capCands" class="cand"></div>
        <div style="display:flex; gap:10px">
          <button id="capAdd" class="btn" style="flex:1">Thêm vào ToDo</button>
          <button id="capClear" class="btn-ghost">Xoá danh sách</button>
        </div>
      </div>
    </div>
  </div>

  <input id="filePicker" type="file" accept="application/json" style="display:none" />

  <script>
    // ============================
    // ToDo Mobile — with Chat Capture & Focus Route
    // ============================
    const $ = (sel, el=document) => el.querySelector(sel);
    const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));

    const storeKey = 'todo_mobile_v2';
    let tasks = load();
    let filter = 'all';
    let editingId = null;

    function load(){ try{ return JSON.parse(localStorage.getItem(storeKey)) || [] }catch{ return [] } }
    function save(){ localStorage.setItem(storeKey, JSON.stringify(tasks)) }
    function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36) }

    function addTask(title, opts={}){
      const t = {
        id: uid(), title: (title||'').trim(), notes: opts.notes||'', prio: opts.prio||2, done:false,
        due: opts.due||'', time: opts.time||'', tags: opts.tags||[], links: opts.links||[], createdAt: Date.now()
      };
      if(!t.title) return; tasks.unshift(t); save(); render();
    }
    function updateTask(id, patch){ const i = tasks.findIndex(x=>x.id===id); if(i<0) return; tasks[i] = {...tasks[i], ...patch}; save(); render(); }
    function removeTask(id){ tasks = tasks.filter(x=>x.id!==id); save(); render(); }

    function todayStr(){ const d = new Date(); return d.toISOString().slice(0,10) }

    function matchesFilter(t){
      if(filter==='all') return true;
      if(filter==='today') return (t.due && t.due===todayStr());
      if(filter==='pending') return !t.done;
      if(filter==='done') return t.done;
      if(filter==='priority') return t.prio===1 && !t.done;
      return true;
    }
    function matchesSearch(t){ const q = $('#search').value.trim().toLowerCase(); if(!q) return true; return (t.title+"\n"+t.notes+"\n"+(t.tags||[]).join(' ')).toLowerCase().includes(q); }

    function fmtDue(d){ if(!d) return 'Không hạn'; const today = todayStr(); if(d===today) return 'Hôm nay'; const ts = new Date(d), now = new Date(today); const diff = Math.round((ts-now)/86400000); if(diff===1) return 'Ngày mai'; if(diff===-1) return 'Hôm qua'; return d.split('-').reverse().join('/'); }
    function prioBadge(p){ return p==1? 'Cao': (p==3? 'Thấp':'TB'); }

    function render(){
      renderTimeline();
      const list = $('#list'); list.innerHTML='';
      const data = tasks.filter(t=>matchesFilter(t)&&matchesSearch(t));
      if(!data.length){ list.innerHTML = `<div class="empty">Không có việc nào. Hãy thêm mục mới!</div>`; return; }
      for(const t of data){
        const card = document.createElement('div'); card.className='card'; card.innerHTML = `<div class="rail"><span class="left">✓ Hoàn tất</span><span class="right">Xoá</span></div>`;
        const row = document.createElement('div'); row.className='item'; row.setAttribute('data-id', t.id);
        const tags = (t.tags||[]).slice(0,3).map(x=>`<span class="badge">${escapeHTML(x)}</span>`).join('');
        const links = (t.links||[]).slice(0,2).map(x=>`<a class="badge" href="${x}" target="_blank" rel="noreferrer">🔗 link</a>`).join('');
        row.innerHTML = `
          <button class="check ${t.done? 'done':''}" aria-label="toggle">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
          <div class="meta">
            <div class="title ${t.done?'done':''}">${escapeHTML(t.title)}</div>
            <div class="sub">
              <span class="badge prio-${t.prio}">Ưu tiên: ${prioBadge(t.prio)}</span>
              <span class="badge">${fmtDue(t.due)}${t.time? ' • '+t.time:''}</span>
              ${tags} ${links}
              ${t.notes? `<span class="badge" title="Ghi chú">📝 ${escapeHTML(t.notes.slice(0,30))}${t.notes.length>30?'…':''}</span>`:''}
            </div>
          </div>
          <div class="actions">
            <button class="iconbtn edit" title="Sửa">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
            </button>
            <button class="iconbtn del" title="Xoá">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
            </button>
          </div>`;
        row.querySelector('.check').addEventListener('click', () => updateTask(t.id, {done: !t.done}));
        row.querySelector('.edit').addEventListener('click', () => openModal(t.id));
        row.querySelector('.del').addEventListener('click', () => confirmDelete(t.id));
        enableSwipe(card, row, t.id);
        card.appendChild(row); list.appendChild(card);
      }
    }

    function renderTimeline(){
      const cont = $('#timeline'); cont.innerHTML='';
      const today = todayStr();
      const items = tasks.filter(t=>!t.done && t.due===today).map(t=>({
        id:t.id,
        time: t.time||'--:--',
        text: t.title,
        prio: t.prio
      })).sort((a,b)=> (a.time||'').localeCompare(b.time||''));
      if(!items.length){ cont.innerHTML = `<div class="empty">Chưa có lịch hôm nay.</div>`; return; }
      for(const it of items){
        const row = document.createElement('div'); row.className='trow';
        row.innerHTML = `<div class="ttime">${it.time}</div><div class="tpill">${escapeHTML(it.text)} <span class="badge prio-${it.prio}" style="margin-left:8px">P${it.prio}</span></div>`;
        cont.appendChild(row);
      }
    }

    function escapeHTML(s){ return (s||'').replace(/[&<>]/g, c=> ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]) ) }

    // Swipe: right=done, left=delete
    function enableSwipe(card, row, id){
      let startX=0, curX=0, dragging=false; const max=92;
      row.addEventListener('touchstart', (e)=>{ startX = e.touches[0].clientX; dragging=true; row.style.transition='none'; card.querySelector('.rail').style.pointerEvents='none'; }, {passive:true});
      row.addEventListener('touchmove', (e)=>{ if(!dragging) return; curX = e.touches[0].clientX - startX; const lim = Math.max(Math.min(curX, max), -max); row.style.transform = `translateX(${lim}px)`; card.style.background = lim>20? 'linear-gradient(90deg, rgba(16,185,129,.18), transparent)': (lim<-20? 'linear-gradient(270deg, rgba(239,68,68,.18), transparent)': ''); }, {passive:true});
      row.addEventListener('touchend', ()=>{ if(!dragging) return; dragging=false; row.style.transition='transform .18s ease'; card.style.background=''; if(curX>68){ updateTask(id, {done:true}); } else if(curX<-68){ confirmDelete(id); } row.style.transform=''; }, {passive:true});
    }

    function openModal(id){
      editingId = id; const t = tasks.find(x=>x.id===id) || parseQuick($('#newTitle').value.trim());
      $('#fTitle').value = t.title||''; $('#fDue').value = t.due||''; $('#fTime').value = t.time||''; $('#fPrio').value = t.prio||2; $('#fNotes').value = t.notes||''; $('#fTags').value = (t.tags||[]).join(' ');
      $('#modal').style.display='flex';
    }
    function closeModal(){ $('#modal').style.display='none'; editingId=null }
    function confirmDelete(id){ if(confirm('Xoá công việc này?')) removeTask(id); }

    // Snooze helpers
    function addDays(iso, days){ if(!iso){ const d=new Date(); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10);} const d=new Date(iso); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
    $('#snooze30').addEventListener('click', ()=>{ if(!editingId) return; const t=tasks.find(x=>x.id===editingId); const [h,m]=(t.time||'09:00').split(':').map(Number); let d=new Date(t.due||todayStr()); d.setHours(h,m+30); const iso=d.toISOString().slice(0,10); const hh=String(d.getHours()).padStart(2,'0'), mm=String(d.getMinutes()).padStart(2,'0'); updateTask(editingId,{due:iso,time:`${hh}:${mm}`}); });
    $('#snooze1d').addEventListener('click', ()=>{ if(!editingId) return; const t=tasks.find(x=>x.id===editingId); updateTask(editingId,{due:addDays(t.due||todayStr(),1)}); });

    // Add / Save
    $('#addBtn').addEventListener('click', ()=>{ const q=$('#newTitle').value.trim(); if(!q) return $('#newTitle').focus(); const parsed=parseQuick(q); addTask(parsed.title,{due:parsed.due,time:parsed.time,prio:parsed.prio,tags:parsed.tags}); $('#newTitle').value=''; });
    $('#newTitle').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ $('#addBtn').click(); }});

    $('#saveDetail').addEventListener('click', ()=>{
      const data = { title: $('#fTitle').value.trim(), due: $('#fDue').value, time: $('#fTime').value, prio:+$('#fPrio').value, notes: $('#fNotes').value.trim(), tags: $('#fTags').value.split(/\s+/).filter(Boolean) };
      if(!data.title){ alert('Vui lòng nhập tiêu đề'); return; }
      if(editingId){ updateTask(editingId, data); } else { addTask(data.title, data); }
      closeModal();
    });
    $('#deleteTask').addEventListener('click', ()=>{ if(editingId){ confirmDelete(editingId); closeModal(); }});

    // Search & Filters
    $('#search').addEventListener('input', render);
    function setFilter(val){ filter=val; $$('.chip').forEach(c=> c.classList.toggle('active', c.dataset.filter===val)); $$('.bbtn').forEach(b=> b.classList.toggle('active', b.dataset.filter===val)); render(); }
    $('#chipbar').addEventListener('click', (e)=>{ const b=e.target.closest('.chip'); if(b) setFilter(b.dataset.filter); });
    $$('.bbtn').forEach(b=>{ if(b.dataset.filter) b.addEventListener('click', ()=> setFilter(b.dataset.filter)); });

    // Export / Import JSON
    $('#exportBtn').addEventListener('click', ()=>{ const blob = new Blob([JSON.stringify({exportedAt:new Date().toISOString(), tasks}, null, 2)], {type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='todo-mobile-backup.json'; a.click(); URL.revokeObjectURL(a.href); });
    $('h1').addEventListener('contextmenu', (e)=>{ e.preventDefault(); $('#filePicker').click(); });
    $('#filePicker').addEventListener('change', async (e)=>{ const file=e.target.files[0]; if(!file) return; try{ const text=await file.text(); const json=JSON.parse(text); if(Array.isArray(json.tasks)) tasks=json.tasks; else if(Array.isArray(json)) tasks=json; else return alert('File không hợp lệ'); save(); render(); alert('Khôi phục xong!'); }catch{ alert('Không đọc được file'); } e.target.value=''; });

    // ============ Capture from chat ============
    $('#captureBtn').addEventListener('click', ()=> $('#capModal').style.display='flex');
    $('#closeCap').addEventListener('click', ()=> $('#capModal').style.display='none');
    $('#capClear').addEventListener('click', ()=> $('#capCands').innerHTML='');
    $('#capSelectAll').addEventListener('click', ()=> $$('#capCands input[type="checkbox"]').forEach(c=> c.checked=true));
    $('#capParse').addEventListener('click', ()=>{
      const text = $('#capSrc').value; const cands = extractCandidates(text);
      const wrap = $('#capCands'); wrap.innerHTML='';
      if(!cands.length){ wrap.innerHTML = '<div class="empty">Không tìm thấy mục nào. Hãy thêm dấu gạch đầu dòng hoặc câu mệnh lệnh.</div>'; return; }
      for(const c of cands){
        const row = document.createElement('div'); row.className='row';
        row.innerHTML = `<input type="checkbox" checked> <div>
          <div style="font-weight:700">${escapeHTML(c.title)}</div>
          <div class="sub" style="margin-top:4px">
            <span class="badge">${c.due? 'Hạn: '+fmtDue(c.due):'Không hạn'}</span>
            ${c.time? `<span class="badge">${c.time}</span>`:''}
            <span class="badge prio-${c.prio}">P${c.prio}</span>
            ${c.tags.map(t=>`<span class="badge">${escapeHTML(t)}</span>`).join('')}
            ${c.links.map(l=>`<span class="badge">🔗</span>`).join('')}
          </div>
        </div>`;
        row.dataset.payload = JSON.stringify(c);
        wrap.appendChild(row);
      }
    });

    $('#capAdd').addEventListener('click', ()=>{
      const rows = $$('#capCands .row'); let added=0; for(const r of rows){ const cb=r.querySelector('input[type="checkbox"]'); if(!cb.checked) continue; const data=JSON.parse(r.dataset.payload); addTask(data.title, data); added++; } if(added) { $('#capModal').style.display='none'; $('#capCands').innerHTML=''; $('#capSrc').value=''; }
    });

    // ============ NLP-ish helpers (VN heuristics) ============
    const VI_WEEK = { 'thứ 2':1,'thứ hai':1,'t2':1,'thu 2':1,'thứ 3':2,'t3':2,'thứ ba':2,'thứ 4':3,'t4':3,'thứ tư':3,'thứ 5':4,'t5':4,'thứ năm':4,'thứ 6':5,'t6':5,'thứ sáu':5,'thứ 7':6,'t7':6,'thứ bảy':6,'cn':0,'chủ nhật':0 };

    function parseDateLoose(s){
      s = (s||'').toLowerCase();
      // relative words
      if(/hôm nay/.test(s)) return todayStr();
      if(/mai|ngày mai/.test(s)) { const d=new Date(); d.setDate(d.getDate()+1); return d.toISOString().slice(0,10); }
      if(/mốt/.test(s)) { const d=new Date(); d.setDate(d.getDate()+2); return d.toISOString().slice(0,10); }
      // weekday
      for(const k in VI_WEEK){ if(s.includes(k)){ const target=VI_WEEK[k]; const d=new Date(); const cur = d.getDay(); const diff = (target - cur + 7) % 7 || 7; d.setDate(d.getDate()+diff); return d.toISOString().slice(0,10); } }
      // dd/mm or dd-mm or dd.mm (yyyy optional)
      const m = s.match(/\b(\d{1,2})[\/-\.](\d{1,2})(?:[\/-\.](\d{2,4}))?\b/);
      if(m){ let [_,dd,MM,yyyy] = m; const y = yyyy? (yyyy.length===2? (2000+Number(yyyy)): Number(yyyy)) : new Date().getFullYear(); const d=new Date(y, Number(MM)-1, Number(dd)); if(!isNaN(d)) return d.toISOString().slice(0,10); }
      return '';
    }
    function parseTimeLoose(s){ const m = (s||'').toLowerCase().match(/\b(\d{1,2})[:h](\d{2})\b/); if(m){ let [_,h,mn]=m; h=String(h).padStart(2,'0'); return `${h}:${mn}` } if(/sáng/.test(s)) return '09:00'; if(/trưa/.test(s)) return '12:00'; if(/chiều/.test(s)) return '15:00'; if(/tối/.test(s)) return '20:00'; return '' }
    function parsePrio(s){ return /(urgent|khẩn|gấp|!{2,}|p1)/i.test(s)?1: /(p3|thấp)/i.test(s)?3: 2 }
    function parseTags(s){ const t = (s.match(/(^|\s)(#\w+)/g)||[]).map(x=>x.trim()); const at = (s.match(/(^|\s)(@\w+)/g)||[]).map(x=>x.trim()); return [...new Set([...t,...at])] }
    function parseLinks(s){ const re=/(https?:\/\/[^\s]+)/g; return (s.match(re)||[]) }

    function parseQuick(s){
      // Example: "Gặp KH A 10:30 mai #khach !" -> title + due/time/priority/tags
      const due = parseDateLoose(s); const time=parseTimeLoose(s); const prio=parsePrio(s); const tags=parseTags(s); const links=parseLinks(s);
      let title = s.replace(/(^|\s)(#|@)\w+/g,' ').replace(/https?:\/\/\S+/g,' ').replace(/\b(urgent|khẩn|gấp|p[123]|hôm nay|mai|mốt|sáng|trưa|chiều|tối)\b/gi,' ').replace(/\s+/g,' ').trim();
      if(!title) title = s.trim();
      return { title, due, time, prio, tags, links, notes: s };
    }

    function extractCandidates(text){
      const lines = text.split(/\n|\r/).map(x=>x.trim()).filter(Boolean);
      const bullets = lines.flatMap(l=> l.replace(/^[-–—•>\*]+\s*/,'').split(/\s*;\s*/)).map(x=>x.trim()).filter(Boolean);
      const candidates = [];
      for(const raw of bullets){
        // pick sentences that look actionable
        if(!/(làm|gửi|fix|sửa|kiểm tra|review|họp|gặp|call|chốt|deploy|viết|tạo|import|export|thanh toán|bàn giao|test)/i.test(raw) && !/\b(p1|urgent|khẩn|gấp)\b/i.test(raw)) continue;
        const parsed = parseQuick(raw);
        candidates.push(parsed);
      }
      return candidates;
    }

    // Init
    render();
  </script>
</body>
